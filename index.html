  <div class="app">
    <div class="backdrop" id="library-backdrop" aria-hidden="true"></div>
    <aside class="sidebar" id="sidebar" aria-label="内容合集">

      <button class="icon-button drawer-close" id="close-library" type="button" aria-label="关闭合集"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      <div class="section-label">我的合集</div>
      <nav class="filters" aria-label="内容分类">
        <button class="filter" data-category="all" type="button" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span class="filter-label">全部内容</span><span class="filter-count" id="count-all">4</span></button>
        <button class="filter" data-category="letter" type="button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-letter"/></svg><span class="filter-label">情书 💌</span><span class="filter-count" id="count-letter">3</span></button>

      </nav>
      <div class="collection-heading"><span id="collection-heading">所有内容</span><span id="collection-count">4 篇</span></div>

      <div class="sidebar-foot" id="library-summary">给迷湖公主的故事与情书</div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="open-library" type="button" aria-label="打开内容合集" aria-expanded="false" aria-controls="sidebar"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
        <div class="current-heading"><span class="mobile-brand">迷湖公主的小城堡</span><h1 id="current-title">下一封见</h1><div class="header-meta"><span id="current-category">情书 💌</span><span class="dot"></span><span id="header-duration">10:00</span></div></div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换日间或夜间模式" aria-pressed="false"><svg class="icon" aria-hidden="true"><use id="theme-icon" href="#i-sun"/></svg><span class="theme-label" id="theme-label">日间</span></button>
        <button class="follow-toggle" id="follow-toggle" type="button" aria-label="暂停自动跟随朗读" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-follow"/></svg><span class="follow-label" id="follow-label">跟随朗读</span></button>
      </header>
      <section class="stage" aria-label="同步听读面板">
        <div class="scene" id="scene">
          <canvas class="scene-canvas" id="scene-canvas" aria-hidden="true"></canvas>
          <div class="scene-toolbar"><span class="scene-status"><svg class="icon" aria-hidden="true"><use href="#i-wave"/></svg><span id="scene-status">等待播放</span></span><span class="scene-number" id="scene-number">01 / 02</span></div>
          <div class="lyrics-scroll" id="lyrics-scroll" tabindex="0" aria-label="正文，可滚动或点击句子跳转音频"><div class="lyrics-list" id="lyrics-list"></div></div>
          <span class="scene-hint"><svg class="icon" aria-hidden="true"><use href="#i-pointer"/></svg>点击句子，听到这里</span>
          <button class="return-current" id="return-current" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-follow"/></svg>回到正在读的地方</button>
        </div>
      </section>
    </main>
    <footer class="player" id="player" aria-label="音频播放控制">
      <div class="now-playing"><div class="art-cover is-letter" id="now-cover" aria-hidden="true"><span class="mini-envelope"></span></div><div class="now-playing-text"><div class="now-playing-title" id="now-title">下一封见</div><div class="now-playing-category" id="now-category">情书 💌</div></div></div>
      <div class="transport">
        <div class="transport-buttons">
          <button class="icon-button" id="previous" type="button" aria-label="上一篇"><svg class="icon" aria-hidden="true"><use href="#i-prev"/></svg></button>
          <button class="icon-button skip" id="rewind" type="button" aria-label="后退 15 秒"><svg class="icon" aria-hidden="true"><use href="#i-back15"/></svg></button>
          <button class="main-play" id="play" type="button" aria-label="播放音频"><svg class="icon play-glyph" aria-hidden="true"><use href="#i-play"/></svg><svg class="icon pause-glyph" aria-hidden="true"><use href="#i-pause"/></svg></button>
          <button class="icon-button skip" id="forward" type="button" aria-label="前进 15 秒"><svg class="icon" aria-hidden="true"><use href="#i-forward15"/></svg></button>
          <button class="icon-button" id="next" type="button" aria-label="下一篇"><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
        </div>
        <div class="seek-row"><span class="time" id="elapsed">00:00</span><input class="range" id="seek" type="range" min="0" max="599.98" step="0.1" value="0" aria-label="播放进度"><span class="time" id="total">10:00</span></div>
      </div>
      <div class="extras"><div class="volume-control"><button class="icon-button" id="mute" type="button" aria-label="静音"><svg class="icon" aria-hidden="true"><use id="volume-icon" href="#i-volume"/></svg></button><input class="range" id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量" style="--progress:100%"></div><button class="speed" id="speed" type="button" aria-label="播放速度 1 倍，点击切换">1×</button><button class="icon-button" id="repeat-button" type="button" aria-label="循环合集" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-repeat"/></svg></button></div>
    </footer>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <audio id="audio" preload="metadata"></audio>
